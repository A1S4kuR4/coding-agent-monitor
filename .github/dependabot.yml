version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # File each problematic major separately so an incompatible bump (e.g.
      # jsdom 30 / TypeScript 7, incompatible with the project's Node 20 +
      # typescript-eslint pin) surfaces on its own PR instead of being masked
      # inside a combined group.
      jsdom:
        patterns: ["jsdom"]
      typescript:
        patterns: ["typescript"]
      vite:
        patterns: ["vite", "@vitejs/plugin-react"]
      other-javascript-dependencies:
        patterns: ["*"]
        exclude-patterns:
          - "jsdom"
          - "typescript"
          - "vite"
          - "@vitejs/plugin-react"
    ignore:
      - dependency-name: "jsdom"
        # jsdom 30 requires Node 22.22+; project stays on Node 20 (see engines).
        # Revisit / remove once the project moves off Node 20.
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
