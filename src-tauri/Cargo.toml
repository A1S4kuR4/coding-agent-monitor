[package]
name = "coding-agent-monitor"
version = "0.5.1"
description = "A lightweight, local-first Windows monitor for coding-agent token usage."
authors = ["Coding Agent Monitor contributors"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "coding_agent_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
# Source-file integrity verification in the SQLite safety tests.
sha2 = "0.11"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Production collection uses the vendored ccusage workspace inside the product
# EXE's isolated worker (see vendor/ccusage/PATCHES.md); no external sidecar.
ccusage-adapter-all = { path = "vendor/ccusage/rust/crates/ccusage-adapter-all" }
# SharedArgs lives here; collector::ccusage builds offline vendor call arguments.
ccusage-cli = { path = "vendor/ccusage/rust/crates/ccusage-cli" }
# System IANA time zone for the production batch request (Phase 4B): the
# worker's day bucketing must match the parent's `chrono::Local` `today`.
# Same version/features the vendored engine uses, so the build graph is
# unchanged apart from this direct edge.
jiff = { version = "0.2.35", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-zoneinfo",
    "tzdb-bundle-platform",
] }
# Vendor load-context types (LoadDiag/LoadFailure kinds) are converted to CAM
# types inside collector::ccusage; never used in public signatures.
ccusage-core = { path = "vendor/ccusage/rust/crates/ccusage-core" }
# Host-side storage uses the same sqlite crate as the vendored adapters so the
# binary carries exactly one SQLite native linkage (sqlite3-src). See the
# v0.3 Gate 0 record in docs/.
sqlite = { version = "0.37.0", default-features = false, features = ["bundled", "linkage"] }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tray language resolution (T03): reads the Windows UI language via
# GetUserDefaultUILanguage. Same crate/version already in the build graph via
# Tauri; T05 adds only feature edges on the same crate (Win32_Foundation,
# Win32_System_Registry for the per-user Run key, Win32_System_Threading for
# the single-instance mutex/event).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
